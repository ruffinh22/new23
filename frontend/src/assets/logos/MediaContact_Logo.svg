<svg viewBox="0 0 580 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient rouge -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF1A27;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C40510;stop-opacity:1" />
    </linearGradient>
    
    <!-- Ombre -->
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>
  
  <!-- Cercle rouge avec M -->
  <circle cx="45" cy="55" r="38" fill="url(#redGrad)" filter="url(#dropShadow)"/>
  <text x="59" y="72" font-family="Arial, sans-serif" font-size="50" font-weight="bold" fill="white" text-anchor="middle">M</text>
  
  <!-- EDIA CONTACT -->
  <text x="85" y="58" font-family="Arial, sans-serif" font-size="30" font-weight="900" fill="#000000" letter-spacing="-1">
    EDIA CONTACT
  </text>
  
  <!-- SGDRA avec contour rouge -->
  <text x="85" y="83" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#000000" stroke="#E30613" stroke-width="0.7" letter-spacing="1.5">
    SGDRA
  </text>
  
  <!-- The offshore company -->
  <text x="173" y="83" font-family="Georgia, serif" font-size="15" font-style="italic" fill="#4A4A4A">
    The offshore company
  </text>
</svg>